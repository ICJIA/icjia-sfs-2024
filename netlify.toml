# Netlify config for the SFS Astro/Tailwind site.

[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.22.2"
  # Belt-and-suspenders pin alongside the `packageManager` field in
  # package.json. Guards against an older corepack on Netlify's build
  # image silently falling back to npm.
  PNPM_VERSION = "10.33.0"

# --------------------------------------------------------------------------
# Redirects / rewrites
# --------------------------------------------------------------------------

# `/sitemap.xml` 200-rewrite to the flat shard.
#
# `@astrojs/sitemap` always emits TWO files — `sitemap-index.xml` (a
# `<sitemapindex>` wrapper) and `sitemap-0.xml` (the actual `<urlset>`).
# It never emits `sitemap.xml`, so the conventional URL returns 404 by
# default. SEO scanners, Google Search Console's submission UI, and AI
# crawlers all probe `/sitemap.xml` first, so we 200-rewrite (NOT 301)
# to the flat shard. The trailing-slash variant covers link checkers
# that auto-append `/`. Pattern from v6.3 checklist §"/sitemap.xml
# routing".
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-0.xml"
  status = 200

[[redirects]]
  from = "/sitemap.xml/"
  to = "/sitemap-0.xml"
  status = 200

# OG image moved jpg → png (v6.4, 2026-06-08). 301 so any already-cached
# /og-image.jpg reference (social scrapers, mail templates) resolves to the
# new branded card instead of 404ing.
[[redirects]]
  from = "/og-image.jpg"
  to = "/og-image.png"
  status = 301

# --------------------------------------------------------------------------
# Headers — caching + baseline security
# --------------------------------------------------------------------------

# Build-hashed Astro bundles are immutable; cache forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Web fonts shipped from the bundle (Fontsource).
[[headers]]
  for = "/_astro/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/_astro/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# Splash / marketing imagery.
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.gif"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Downloadable assets.
[[headers]]
  for = "/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.docx"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Sitemap / robots — short cache so updates propagate quickly.
[[headers]]
  for = "/sitemap-index.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap-0.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# HTML — short cache + must-revalidate (NOT no-store) so bf-cache stays
# eligible. Full security header set applied here.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    # Modern guidance: the legacy XSS filter has had CVEs; explicit "0"
    # beats unset.
    X-XSS-Protection = "0"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Process isolation: blocks cross-origin windows from accessing this
    # origin via window.opener.
    Cross-Origin-Opener-Policy = "same-origin"
    # Public share assets (og-image, favicon, hotlinked logos, PDFs) must
    # be embeddable from other origins. same-origin made browser-based OG
    # scanners (MetaPeek + Slack/iMessage/Discord unfurlers) refuse them
    # despite a 200 OK; server-side crawlers (FB/LinkedIn) were fine. See
    # checklist v6.4 §4. COOP above stays same-origin (orthogonal).
    Cross-Origin-Resource-Policy = "cross-origin"
    # Content-Security-Policy:
    #   - script-src: 'self' for bundled Astro scripts; sha256 hashes
    #     for every inline <script> Astro emits (it auto-inlines small
    #     ones). Currently four:
    #       1. URL normalizer (Layout.astro)                 — every page
    #       2. Nav active-link marker (Nav.astro)            — every page
    #       3. Header/drawer/dropdown wiring (Layout.astro)  — every page
    #       4. Sites table scroll a11y (sites.astro)         — /sites
    #     If you change the byte content of ANY inline <script> (even
    #     whitespace), the hash invalidates and the script is CSP-
    #     blocked. NOTE: an Astro upgrade rotates these too — the Astro 7
    #     compiler re-minifies inline scripts (backticks, shorter idents),
    #     which changed 3 of the 4 hashes below. Regenerate the full list
    #     via:
    #
    #       pnpm build && node scripts/csp-hashes.mjs
    #
    #     then paste the printed snippet into both netlify.toml AND
    #     public/_headers (they must stay in sync).
    #
    #   - No 'unsafe-eval': the nav interactivity is vanilla DOM (the old
    #     Alpine island needed eval for its x-* directives; removed v2.1).
    #   - https://plausible.icjia.cloud allows the analytics script + XHR.
    #   - frame-src is 'self' only. The ArcGIS allowance was dropped when
    #     the map embed was removed from /sites in favour of the SFY 2027
    #     grantee table; the site no longer frames any third-party origin.
    #   - style-src keeps 'unsafe-inline' because of inline style="…"
    #     attributes ported from the Vue/Vuetify build. Long-term migrate
    #     those to scoped <style> blocks and drop the exception.
    Content-Security-Policy = """\
default-src 'self'; \
script-src 'self' 'sha256-Cd8mEBngrAm9wsHx9r1GVpVdHGGhGhBAHhVObVmEVbs=' 'sha256-RRXLRvtjQfzsd4i/TXrKRhXfyRU4KVuI4+p2UcDDgGo=' 'sha256-k7GotmwmqTd6ZKHyaVKDud/h/pZsGM/xC8tCcg1YESo=' 'sha256-4hrJu3bwv+nQcIjLotdrbXoOpXt79Am8vubFXFgiC1U=' https://plausible.icjia.cloud; \
style-src 'self' 'unsafe-inline'; \
img-src 'self' data:; \
font-src 'self' data:; \
connect-src 'self' https://plausible.icjia.cloud https://ingesteer.services-prod.nsvcs.net;\
frame-src 'self'; \
frame-ancestors 'self'; \
base-uri 'self'; \
form-action 'self'; \
object-src 'none'\
"""

# Deploy-preview / branch-deploy CSP overrides — add app.netlify.com to
# frame-src so the preview admin overlay can iframe back to Netlify
# without throwing console errors. Production stays strict.
[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    Content-Security-Policy = """\
default-src 'self'; \
script-src 'self' 'sha256-Cd8mEBngrAm9wsHx9r1GVpVdHGGhGhBAHhVObVmEVbs=' 'sha256-RRXLRvtjQfzsd4i/TXrKRhXfyRU4KVuI4+p2UcDDgGo=' 'sha256-k7GotmwmqTd6ZKHyaVKDud/h/pZsGM/xC8tCcg1YESo=' 'sha256-4hrJu3bwv+nQcIjLotdrbXoOpXt79Am8vubFXFgiC1U=' https://plausible.icjia.cloud; \
style-src 'self' 'unsafe-inline'; \
img-src 'self' data:; \
font-src 'self' data:; \
connect-src 'self' https://plausible.icjia.cloud https://ingesteer.services-prod.nsvcs.net;\
frame-src 'self' https://app.netlify.com; \
frame-ancestors 'self'; \
base-uri 'self'; \
form-action 'self'; \
object-src 'none'\
"""

[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    Content-Security-Policy = """\
default-src 'self'; \
script-src 'self' 'sha256-Cd8mEBngrAm9wsHx9r1GVpVdHGGhGhBAHhVObVmEVbs=' 'sha256-RRXLRvtjQfzsd4i/TXrKRhXfyRU4KVuI4+p2UcDDgGo=' 'sha256-k7GotmwmqTd6ZKHyaVKDud/h/pZsGM/xC8tCcg1YESo=' 'sha256-4hrJu3bwv+nQcIjLotdrbXoOpXt79Am8vubFXFgiC1U=' https://plausible.icjia.cloud; \
style-src 'self' 'unsafe-inline'; \
img-src 'self' data:; \
font-src 'self' data:; \
connect-src 'self' https://plausible.icjia.cloud https://ingesteer.services-prod.nsvcs.net;\
frame-src 'self' https://app.netlify.com; \
frame-ancestors 'self'; \
base-uri 'self'; \
form-action 'self'; \
object-src 'none'\
"""
